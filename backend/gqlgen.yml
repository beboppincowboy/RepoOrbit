schema:
  - graphql/schema.graphqls
exec:
  filename: graphql/generated.go
  package: graph
model:
  filename: graphql/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: graphql
  package: graph
  filename_template: '{name}.resolvers.go'
models:
  Int64:
    model: github.com/99designs/gqlgen/graphql.Int64
  RepositoryOverview:
    model: github.com/repoorbit/repoorbit/backend/graphql/model.RepositoryOverview
  MetricCoverage:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.Coverage
  MetricCount:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.Count
  MetricMedian:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.Median
  MetricContributor:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.Contributor
  MetricActor:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.Actor
  MetricTimelineEntry:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.TimelineEntry
  MetricTimelineCoverage:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.TimelineCoverage
  MetricDailyPoint:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.DailyPoint
  CrossRepositoryOverview:
    model: github.com/repoorbit/repoorbit/backend/graphql/model.CrossRepositoryOverview
  AttentionItem:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.AttentionItem
    fields:
      repositoryId:
        resolver: true
      runId:
        resolver: true
  AssignedIssue:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.AssignedIssue
    fields:
      repositoryId:
        resolver: true
  CrossDailyPoint:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.CrossDailyPoint
  MetricRate:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.Rate
  ActionsDailyPoint:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.ActionsDailyPoint
  WorkflowFailureSummary:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.WorkflowFailureSummary
    fields:
      workflowId:
        resolver: true
      latestRunId:
        resolver: true
  WorkflowRunSummary:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.WorkflowRunSummary
    fields:
      id:
        resolver: true
      workflowId:
        resolver: true
  WorkflowJobDetail:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.WorkflowJobDetail
    fields:
      id:
        resolver: true
      runId:
        resolver: true
  WorkflowRunDetail:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.WorkflowRunDetail
  DeploymentSummary:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.DeploymentSummary
    fields:
      id:
        resolver: true
  RepositoryActions:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.RepositoryActions
  DeliveryCheck:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.DeliveryCheck
    fields:
      runId:
        resolver: true
  LinkedPullRequestDelivery:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.LinkedPullRequestDelivery
  IssueDelivery:
    model: github.com/repoorbit/repoorbit/backend/internal/analytics.IssueDelivery
